<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Meal Planner</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
padding:40px;
text-align:center;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

button{
background:#4CAF50;
color:white;
border:none;
padding:15px 25px;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#45a049;
}

.meal{
margin-top:20px;
padding:15px;
border:1px solid #ddd;
border-radius:8px;
}

.macros{
margin-top:20px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>Meal Planner</h1>

<button onclick="generateMealPlan()">
Generează Planul
</button>

<div id="meals"></div>

<div class="macros" id="totals"></div>

</div>

<script>

let db = {};

fetch("foods_520_database.json")
.then(res=>res.json())
.then(data=>{
db=data;
console.log("Database loaded",db);
});

function randomItem(arr){
return arr[Math.floor(Math.random()*arr.length)];
}

function generateMealPlan(){

const breakfast=randomItem(db.mic_dejun);
const lunch=randomItem(db.pranz);
const dinner=randomItem(db.cina);
const snack=randomItem(db.gustare);

const meals=[

["Mic Dejun",breakfast],
["Prânz",lunch],
["Cină",dinner],
["Gustare",snack]

];

let html="";
let totalKcal=0;
let totalP=0;
let totalF=0;
let totalC=0;

meals.forEach(m=>{

const meal=m[1];

totalKcal+=meal.kcal;
totalP+=meal.p;
totalF+=meal.f;
totalC+=meal.c;

html+=`
<div class="meal">
<h3>${m[0]}</h3>
<p><b>${meal.n}</b></p>
<p>Calorii: ${meal.kcal}</p>
<p>Proteine: ${meal.p}g</p>
<p>Grăsimi: ${meal.f}g</p>
<p>Carbohidrați: ${meal.c}g</p>
</div>
`;

});

document.getElementById("meals").innerHTML=html;

document.getElementById("totals").innerHTML=`
Total calorii: ${totalKcal} kcal<br>
Proteine: ${totalP} g<br>
Grăsimi: ${totalF} g<br>
Carbohidrați: ${totalC} g
`;

}

</script>

</body>
</html>
