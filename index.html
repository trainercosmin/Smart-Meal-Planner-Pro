<!doctype html>
<html lang="ro">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Meal Planner Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&amp;family=Outfit:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1a1a2e 50%, #0f3a2e 100%);
      color: #e8ebf0;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 20% 30%, rgba(16, 185, 129, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(34, 197, 94, 0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
      background: linear-gradient(135deg, #0f172a 0%, #1a1f35 50%, #1a2e2a 100%);
      padding: 48px;
      border-radius: 28px;
      border: 1.5px solid rgba(16, 185, 129, 0.3);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                  inset 0 1px 0 rgba(16, 185, 129, 0.2),
                  0 0 40px rgba(16, 185, 129, 0.1);
      animation: slideUp 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      z-index: 1;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      text-align: center;
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      text-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
    }

    .subtitle {
      text-align: center;
      color: #a0d8b0;
      margin-bottom: 40px;
      font-size: 1rem;
      font-weight: 500;
    }

    .grid-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      animation: fadeInUp 0.6s ease-out forwards;
      opacity: 0;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .input-group:nth-child(1) { animation-delay: 0.1s; }
    .input-group:nth-child(2) { animation-delay: 0.15s; }
    .input-group:nth-child(3) { animation-delay: 0.2s; }
    .input-group:nth-child(4) { animation-delay: 0.25s; }
    .input-group:nth-child(5) { animation-delay: 0.3s; }
    .input-group:nth-child(6) { animation-delay: 0.35s; }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: 'Outfit', sans-serif;
      transition: all 0.3s ease;
      background: rgba(15, 23, 42, 0.6);
      color: #e8ebf0;
    }

    input::placeholder, select {
      color: #6b9b8a;
    }

    input:focus, select:focus {
      border-color: #10b981;
      outline: none;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
      background: rgba(15, 23, 42, 0.9);
      color: #10ff88;
    }

    input.error {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.05);
    }

    .error-text {
      font-size: 0.7rem;
      color: #f87171;
      margin-top: 4px;
      display: none;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .allergy-section {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(6, 182, 212, 0.08) 100%);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid rgba(16, 185, 129, 0.25);
      margin-bottom: 28px;
      animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
      opacity: 0;
    }

    .allergy-section > label {
      color: #10ff88;
      margin-bottom: 14px;
      display: block;
      font-weight: 700;
    }

    .allergy-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .check-item {
      display: flex;
      align-items: center;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 10px;
      transition: all 0.3s ease;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .check-item:hover {
      background: rgba(16, 185, 129, 0.18);
      border-color: rgba(16, 185, 129, 0.6);
      transform: translateX(4px);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    }

    .check-item input {
      width: 18px;
      height: 18px;
      margin-right: 8px;
      cursor: pointer;
      accent-color: #10b981;
    }

    .btn-calc {
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      width: 100%;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Outfit', sans-serif;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
    }

    .btn-calc::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.25);
      transition: left 0.4s ease;
    }

    .btn-calc:hover:not(:disabled)::before {
      left: 100%;
    }

    .btn-calc:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 20px 50px rgba(16, 185, 129, 0.5);
    }

    .btn-calc:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-calc:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner.active {
      display: block;
    }

    #results-summary {
      margin-top: 32px;
      padding: 32px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, rgba(6, 182, 212, 0.12) 100%);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #e8ebf0;
      text-align: center;
      display: none;
      animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.15);
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    #results-summary h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.4rem;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #results-summary p {
      font-size: 0.95rem;
      color: #a0d8b0;
    }

    .day-card {
      margin-top: 28px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(26, 46, 42, 0.8) 100%);
      border-radius: 18px;
      border: 1px solid rgba(16, 185, 129, 0.2);
      overflow: hidden;
      animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .day-card:hover {
      border-color: rgba(16, 185, 129, 0.6);
      box-shadow: 0 20px 50px rgba(16, 185, 129, 0.25);
      transform: translateY(-4px);
    }

    .day-title {
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      color: white;
      padding: 20px;
      font-weight: 800;
      text-align: center;
      font-size: 1.3rem;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .meal-row {
      padding: 24px;
      border-bottom: 1px solid rgba(16, 185, 129, 0.1);
    }

    .meal-row:last-child {
      border-bottom: none;
    }

    .meal-name {
      color: #10ff88;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .meal-emoji {
      font-size: 1.6rem;
    }

    .food-option {
      padding: 14px 16px;
      background: rgba(16, 185, 129, 0.08);
      border-radius: 10px;
      border-left: 3px solid #10b981;
      font-size: 0.95rem;
      font-weight: 600;
      color: #e8ebf0;
      transition: all 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .food-option:hover {
      background: rgba(16, 185, 129, 0.15);
      border-left-color: #06b6d4;
      transform: translateX(6px);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    }

    .food-text {
      flex: 1;
      font-size: 0.9rem;
    }

    .food-kcal {
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      color: white;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      margin-left: 12px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .info-btn {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.5);
      color: #10ff88;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      transition: all 0.2s ease;
      margin-left: 8px;
      position: relative;
    }

    .info-btn:hover {
      background: rgba(16, 185, 129, 0.4);
      border-color: #10ff88;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }

    .tooltip {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 0;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.98) 0%, rgba(26, 46, 42, 0.98) 100%);
      border: 1px solid rgba(16, 185, 129, 0.6);
      border-radius: 10px;
      padding: 14px;
      font-size: 0.85rem;
      color: #e8ebf0;
      z-index: 1000;
      min-width: 280px;
      max-width: 320px;
      margin-bottom: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      line-height: 1.5;
      font-weight: 500;
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 12px;
      width: 8px;
      height: 8px;
      background: rgba(16, 185, 129, 0.6);
      border-radius: 2px;
      transform: rotate(45deg);
    }

    .info-btn:hover .tooltip {
      display: block;
    }

    .or-divider {
      text-align: center;
      margin: 12px 0;
      font-weight: 700;
      color: #4b7a6b;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    .no-safe {
      color: #f87171;
      font-weight: 600;
      padding: 14px;
      background: rgba(239, 68, 68, 0.05);
      border-radius: 10px;
      border-left: 3px solid #ef4444;
      font-size: 0.9rem;
    }

    .day-card:nth-child(1) { animation-delay: 0.1s; }
    .day-card:nth-child(2) { animation-delay: 0.2s; }
    .day-card:nth-child(3) { animation-delay: 0.3s; }
    .day-card:nth-child(4) { animation-delay: 0.4s; }
    .day-card:nth-child(5) { animation-delay: 0.5s; }
    .day-card:nth-child(6) { animation-delay: 0.6s; }
    .day-card:nth-child(7) { animation-delay: 0.7s; }

    @media (max-width: 768px) {
      .wrapper {
        padding: 28px;
        border-radius: 16px;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 6px;
      }

      .grid-inputs {
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
      }

      .btn-calc {
        font-size: 0.95rem;
        padding: 14px;
      }

      .day-title {
        font-size: 1.1rem;
        padding: 16px;
      }

      .meal-row {
        padding: 18px;
      }

      .food-option {
        font-size: 0.85rem;
        flex-direction: column;
        align-items: flex-start;
      }

      .food-kcal {
        margin-left: 0;
        margin-top: 8px;
      }
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
 </head>
 <body>
  <div class="wrapper">
   <h1 id="app-title">Smart Meal Planner Pro</h1>
   <p class="subtitle">Planul nutrițional personalizat în 60 de secunde</p>
   <div class="grid-inputs">
    <div class="input-group">
     <label for="sex">Sex</label> <select id="sex"> <option value="m">Masculin</option> <option value="f">Feminin</option> </select> <span class="error-text" id="sex-error"></span>
    </div>
    <div class="input-group">
     <label for="w">Greutate (kg)</label> <input type="number" id="w" value="75" min="30" max="200"> <span class="error-text" id="w-error"></span>
    </div>
    <div class="input-group">
     <label for="h">Înălțime (cm)</label> <input type="number" id="h" value="180" min="140" max="230"> <span class="error-text" id="h-error"></span>
    </div>
    <div class="input-group">
     <label for="age">Vârstă</label> <input type="number" id="age" value="30" min="15" max="100"> <span class="error-text" id="age-error"></span>
    </div>
    <div class="input-group">
     <label for="act">Activitate</label> <select id="act"> <option value="1.2">Sedentar</option> <option value="1.375">Ușor Activ</option> <option value="1.55">Moderat</option> <option value="1.725">Intens</option> </select>
    </div>
    <div class="input-group">
     <label for="mCount">Nr. Mese</label> <select id="mCount"> <option value="3">3 Mese</option> <option value="4">4 Mese</option> <option value="5">5 Mese</option> </select>
    </div>
    <div class="input-group">
     <label for="goal">Obiectiv</label> <select id="goal"> <option value="loss">📉 Scădere Greutate</option> <option value="maintain">➡️ Menținere</option> <option value="muscle">📈 Masă Musculară</option> </select>
    </div>
   </div>
   <div class="allergy-section">
    <label>⚠️ Excludere Alergeni:</label>
    <div class="allergy-grid" id="allergens"><label class="check-item"><input type="checkbox" value="lactoza"> Lactoză</label> <label class="check-item"><input type="checkbox" value="gluten"> Gluten</label> <label class="check-item"><input type="checkbox" value="ou"> Ouă</label> <label class="check-item"><input type="checkbox" value="nuci"> Nuci</label> <label class="check-item"><input type="checkbox" value="peste"> Pește</label> <label class="check-item"><input type="checkbox" value="soia"> Soia</label>
    </div>
   </div><button class="btn-calc" onclick="generate()" id="calc-btn"> <span class="spinner" id="spinner"></span> <span id="btn-text">CALCULEAZĂ PLANUL DE MASĂ</span> </button>
   <div id="results-summary"></div>
   <div id="plan-container"></div>
  </div>
  <script>
    const defaultConfig = {
      app_title: "Smart Meal Planner Pro",
      button_text: "CALCULEAZĂ PLANUL DE MASĂ"
    };

    let config = { ...defaultConfig };

    const mealEmojis = {
      "Mic Dejun": "🌅",
      "Gustare 1": "🍎",
      "Prânz": "☀️",
      "Gustare 2": "🥤",
      "Cină": "🌙"
    };

    // Sistema de tracking pentru a evita repetarea meselor
    let usedMeals = {
      mic_dejun: [],
      pranz: [],
      cina: [],
      gustare: []
    };

    function resetMealsIfNeeded(newExclusions, newGoal) {
      const key = `${newExclusions.join(",")}|${newGoal}`;
      if (window.lastGenerationKey !== key) {
        usedMeals = { mic_dejun: [], pranz: [], cina: [], gustare: [] };
        window.lastGenerationKey = key;
      }
    }

    const db = {
      mic_dejun: [
        { n: "Ouă ochiuri cu bacon și pâine prăjită (3 ouă, 30g bacon, 2 felii pâine)", a: ["ou", "gluten"], kcal: 380, p: 18, f: 20, c: 32 },

        { n: "Ouă rumenite cu slănină și pâine (2 ouă, 40g slănină, 2 felii pâine)", a: ["ou", "gluten"], kcal: 360, p: 16, f: 18, c: 34 },
        { n: "Gris cu lapte și zahăr (50g gris, 250ml lapte, 1 lingură zahăr)", a: ["gluten", "lactoza"], kcal: 280, p: 7, f: 6, c: 52 },
        { n: "Brânză proaspătă cu miere (150g brânză, 1 lingură miere)", a: ["lactoza"], kcal: 240, p: 16, f: 12, c: 22 },
        { n: "Pâine neagră cu unt și brânză (2 felii, 20g unt, 50g brânză)", a: ["gluten", "lactoza"], kcal: 310, p: 10, f: 14, c: 38 },
        { n: "Smoothie banană cu lapte și miere (1 banană, 250ml lapte, miere)", a: ["lactoza"], kcal: 260, p: 8, f: 6, c: 42 },
        { n: "Ouă ochiuri cu roșii și brânză (3 ouă, 100g roșii, 50g brânză)", a: ["ou", "lactoza"], kcal: 320, p: 22, f: 18, c: 8 },
        { n: "Pâine albă cu unt de arahide și banană (2 felii, 20g unt, 1 banană)", a: ["gluten", "nuci"], kcal: 340, p: 10, f: 12, c: 50 },
        { n: "Müesli cu lapte și fructe (50g müesli, 250ml lapte, 100g fructe)", a: ["gluten", "lactoza"], kcal: 330, p: 10, f: 10, c: 52 },
        { n: "Omleta cu brânză și roșii (3 ouă, 60g brânză, 100g roșii)", a: ["ou", "lactoza"], kcal: 310, p: 20, f: 20, c: 6 },
        { n: "Iaurt cu granola și miere (200g iaurt, 40g granola, miere)", a: ["lactoza", "gluten"], kcal: 320, p: 10, f: 12, c: 48 },
        { n: "Pâine prăjită cu cașcaval și muștar (2 felii, 50g cașcaval, muștar)", a: ["gluten", "lactoza"], kcal: 300, p: 12, f: 14, c: 32 },
        { n: "Ouă rumenite cu pâine și unt (3 ouă, 2 felii pâine, 15g unt)", a: ["ou", "gluten", "lactoza"], kcal: 340, p: 16, f: 16, c: 36 },
        { n: "Pudingă de lapte cu cacao (30g praf cacao, 250ml lapte, zahăr)", a: ["lactoza"], kcal: 240, p: 8, f: 5, c: 42 },

    function fisherYatesShuffle(arr) {
      const shuffled = [...arr];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function clearErrors() {
      document.querySelectorAll('.error-text').forEach(el => el.style.display = 'none');
      document.querySelectorAll('input, select').forEach(el => el.classList.remove('error'));
    }

    function validateInputs() {
      clearErrors();
      let valid = true;

      const w = parseFloat(document.getElementById('w').value);
      if (isNaN(w) || w < 30 || w > 200) {
        showError('w', 'Greutate între 30-200 kg');
        valid = false;
      }

      const h = parseFloat(document.getElementById('h').value);
      if (isNaN(h) || h < 140 || h > 230) {
        showError('h', 'Înălțime între 140-230 cm');
        valid = false;
      }

      const age = parseInt(document.getElementById('age').value);
      if (isNaN(age) || age < 15 || age > 100) {
        showError('age', 'Vârstă între 15-100 ani');
        valid = false;
      }

      return valid;
    }

    function showError(fieldId, message) {
      const field = document.getElementById(fieldId);
      const errorEl = document.getElementById(fieldId + '-error');
      field.classList.add('error');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    function generate() {
      if (!validateInputs()) return;

      const btn = document.getElementById('calc-btn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btn-text');

      btn.disabled = true;
      spinner.classList.add('active');
      btnText.textContent = 'Se procesează...';

      setTimeout(() => {
        const w = parseFloat(document.getElementById('w').value);
        const h = parseFloat(document.getElementById('h').value);
        const a = parseInt(document.getElementById('age').value);
        const s = document.getElementById('sex').value;
        const act = parseFloat(document.getElementById('act').value);
        const mCount = parseInt(document.getElementById('mCount').value);
        const goal = document.getElementById('goal').value;
        const excluded = Array.from(document.querySelectorAll('#allergens input:checked')).map(c => c.value);

        // Reset meals tracker if parameters changed
        resetMealsIfNeeded(excluded, goal);

        let bmr = (10 * w) + (6.25 * h) - (5 * a);
        bmr = (s === 'm') ? bmr + 5 : bmr - 161;
        let tdee = Math.round(bmr * act);

        if (goal === 'loss') {
          tdee = Math.round(tdee * 0.85);
        } else if (goal === 'muscle') {
          tdee = Math.round(tdee * 1.10);
        }

        const goalLabels = {
          loss: "📉 Scădere Greutate",
          maintain: "➡️ Menținere",
          muscle: "📈 Masă Musculară"
        };

        const res = document.getElementById('results-summary');
        res.style.display = 'block';
        res.innerHTML = `
          <h2>${tdee} kcal</h2>
          <p>${goalLabels[goal]} • ${mCount} mese • Fără ${excluded.length > 0 ? excluded.join(", ") : "alergeni bifați"}</p>
        `;

        const days = ["Luni", "Marți", "Miercuri", "Joi", "Vineri", "Sâmbătă", "Duminică"];
        let html = "";
        let delayCounter = 0;

        days.forEach(day => {
          html += `<div class="day-card" style="animation-delay: ${delayCounter * 0.1}s">
            <div class="day-title">${day}</div>`;

          html += renderMeal("Mic Dejun", db.mic_dejun, excluded, goal);
          if (mCount >= 4) html += renderMeal("Gustare 1", db.gustare, excluded, goal);
          html += renderMeal("Prânz", db.pranz, excluded, goal);
          if (mCount >= 5) html += renderMeal("Gustare 2", db.gustare, excluded, goal);
          html += renderMeal("Cină", db.cina, excluded, goal);

          html += `</div>`;
          delayCounter++;
        });

        document.getElementById('plan-container').innerHTML = html;

        res.scrollIntoView({ behavior: 'smooth', block: 'start' });

        btn.disabled = false;
        spinner.classList.remove('active');
        btnText.textContent = config.button_text;
      }, 500);
    }

    function renderMeal(label, items, exclusions, goal) {
      // SMART ALLERGEN FILTER: Show foods that DON'T CONTAIN the selected allergens
      const safe = items.filter(f => {
        if (exclusions.length === 0) return true; // No allergens selected, all foods safe
        // Only show foods that don't have ANY of the selected allergens
        return !f.a.some(allergen => exclusions.includes(allergen));
      });

      if (safe.length < 2) {
        return `
          <div class="meal-row">
            <div class="meal-name">${mealEmojis[label] || "🍽️"} ${label}</div>
            <div class="no-safe">⚠️ Nu sunt destule variante sigure pentru albergenii selectați. Încearcă să dezactivezi unele alergeni.</div>
          </div>
        `;
      }

      // Get already used meals for this category
      const categoryKey = label.includes("Gustare") ? "gustare" : (label === "Mic Dejun" ? "mic_dejun" : (label === "Prânz" ? "pranz" : "cina"));
      const used = usedMeals[categoryKey] || [];

      // Filter out already used meals
      let available = safe.filter(meal => !used.includes(meal.n));

      // If all meals used, reset and use all available
      if (available.length < 2) {
        available = safe;
        usedMeals[categoryKey] = [];
      }

      let filteredMeals = available;
      if (goal === 'loss') {
        filteredMeals = available.filter(meal => meal.kcal <= available.reduce((sum, m) => sum + m.kcal, 0) / available.length * 1.1);
      } else if (goal === 'muscle') {
        filteredMeals = available.filter(meal => meal.kcal >= available.reduce((sum, m) => sum + m.kcal, 0) / available.length * 0.95);
      }

      if (filteredMeals.length < 2) {
        filteredMeals = available;
      }

      const shuffled = fisherYatesShuffle(filteredMeals).slice(0, 2);

      // Mark these meals as used
      shuffled.forEach(meal => {
        usedMeals[categoryKey].push(meal.n);
      });

      function getMacroBreakdown(meal) {
        const p = Math.round((meal.p / meal.kcal) * 100);
        const f = Math.round((meal.f / meal.kcal) * 100);
        const c = Math.round((meal.c / meal.kcal) * 100);
        return `P: ${p}% | F: ${f}% | C: ${c}%`;
      }

      return `
        <div class="meal-row">
          <div class="meal-name">${mealEmojis[label] || "🍽️"} ${label}</div>
          <div class="food-option">
            <div class="food-text">
              <div>✓ ${shuffled[0].n}</div>
              <div style="font-size: 0.8rem; color: #a0d8b0; margin-top: 6px;">${getMacroBreakdown(shuffled[0])}</div>
            </div>
            <button class="info-btn" onmouseover="this.querySelector('.tooltip').style.display='block'" onmouseout="this.querySelector('.tooltip').style.display='none'" onclick="event.stopPropagation()">
              📖
              <div class="tooltip">${shuffled[0].prep}</div>
            </button>
            <span class="food-kcal">${shuffled[0].kcal} kcal</span>
          </div>
          <div class="or-divider">— SAU —</div>
          <div class="food-option">
            <div class="food-text">
              <div>✓ ${shuffled[1].n}</div>
              <div style="font-size: 0.8rem; color: #a0d8b0; margin-top: 6px;">${getMacroBreakdown(shuffled[1])}</div>
            </div>
            <button class="info-btn" onmouseover="this.querySelector('.tooltip').style.display='block'" onmouseout="this.querySelector('.tooltip').style.display='none'" onclick="event.stopPropagation()">
              📖
              <div class="tooltip">${shuffled[1].prep}</div>
            </button>
            <span class="food-kcal">${shuffled[1].kcal} kcal</span>
          </div>
        </div>
      `;
    }

    });
